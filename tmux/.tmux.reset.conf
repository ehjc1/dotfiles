# First remove *all* keybindings
# unbind-key -a
# Now reinsert all the regular tmux keys
bind ^X lock-server
bind ^C new-window -c "$HOME"
bind ^D detach
bind * list-clients

bind H previous-window
bind L next-window

bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf
bind ^A last-window
bind ^W list-windows
bind w list-windows
bind z resize-pane -Z
bind ^L refresh-client
bind l refresh-client
bind | split-window
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' choose-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind c kill-pane
bind x swap-pane -D
bind S choose-session
bind R source-file ~/.config/tmux/tmux.conf
bind K send-keys "clear"\; send-keys "Enter"
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Server / Session
# prefix + Ctrl+X    Lock server
# prefix + Ctrl+D    Detach session
# prefix + S         Choose session

# Windows
# prefix + Ctrl+C    New window (in $HOME)
# prefix + Ctrl+A    Last window
# prefix + Ctrl+W    List windows
# prefix + w         List windows
# prefix + H         Previous window
# prefix + L         Next window
# prefix + r         Rename window
# prefix + "         Choose window
# prefix + *         Synchronize panes (overrides list-clients)

# Panes
# prefix + |         Split horizontal
# prefix + s         Split vertical (same dir)
# prefix + v         Split horizontal (same dir)
# prefix + c         Kill pane
# prefix + x         Swap pane down
# prefix + z         Zoom pane (fullscreen toggle)
# prefix + P         Toggle pane border status
# prefix + h         Select pane 
# prefix + j         Select pane 
# prefix + k         Select pane 
# prefix + l         Refresh client (overrides select-pane )

# Resize Panes (repeatable)
# prefix + ,         Resize pane left 20
# prefix + .         Resize pane right 20
# prefix + -         Resize pane down 7
# prefix + =         Resize pane up 7

# Misc
# prefix + R         Reload tmux config
# prefix + Ctrl+L    Refresh client
# prefix + :         Command prompt
# prefix + K         Clear pane

# Copy Mode (vi)
# v                  Begin selection
